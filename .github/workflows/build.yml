name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the exe to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish single-file exe
        # Single-file mode is set in the .csproj (PublishSingleFile + IncludeAllContentForSelfExtract);
        # the flag here just makes it explicit.
        run: dotnet publish src/DgpuWakeMonitor -c Release -o publish -p:PublishSingleFile=true

      - uses: actions/upload-artifact@v4
        with:
          name: dgpuWakeMonitor
          path: publish/dgpuWakeMonitor.exe

      - name: Attach exe to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" publish/dgpuWakeMonitor.exe --clobber
